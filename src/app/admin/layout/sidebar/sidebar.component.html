<!-- ══ ESCRITORIO: menú fijo (visible ≥1200px) ═════════════════════════════════ -->
<aside class="sidebar hidden xl:flex flex-column">
  <ng-container *ngTemplateOutlet="brand"></ng-container>
  <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
</aside>

<!-- ══ MÓVIL / TABLET: panel deslizable de PrimeNG (<1200px) ════════════════════ -->
<p-sidebar [visible]="menu.open()" (visibleChange)="!$event && menu.close()" position="left"
  styleClass="sidebar-drawer" [blockScroll]="true">
  <ng-template pTemplate="header">
    <ng-container *ngTemplateOutlet="brand"></ng-container>
  </ng-template>
  <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
</p-sidebar>

<!-- ══ PLANTILLAS COMPARTIDAS ══════════════════════════════════════════════════ -->
<ng-template #brand>
  <div class="sidebar__brand flex align-items-center gap-2">
    <img src="assets/images/trophy_logo.webp" width="20" height="20" alt="" loading="lazy">
    <span class="sidebar__brand-name">Torneo Fesja 2026</span>
  </div>
</ng-template>

<ng-template #sidebarContent>
  <nav class="sidebar__nav flex-grow-1" aria-label="Menú de administración">
    <span class="sidebar__section-label">ADMINISTRACIÓN</span>

    <ul class="sidebar__menu list-none m-0">
      <li *ngFor="let item of navItems" class="sidebar__menu-item">
        <ng-container *ngIf="item.children">
          <button type="button"
            class="sidebar__link sidebar__link--expandable w-full flex align-items-center justify-content-between"
            [class.sidebar__link--active]="item.expanded" [attr.aria-expanded]="!!item.expanded" (click)="toggleExpand(item)">
            <span class="flex align-items-center gap-2">
              <span class="sidebar__icon" [innerHTML]="getIcon(item.icon)"></span>
              <span class="sidebar__link-label">{{ item.label }}</span>
            </span>
            <span class="sidebar__chevron" [class.sidebar__chevron--open]="item.expanded">
              <i class="pi pi-chevron-right"></i>
            </span>
          </button>

          <ul class="sidebar__submenu list-none m-0" [class.sidebar__submenu--open]="item.expanded">
            <li *ngFor="let child of item.children">
              <a class="sidebar__sublink" [routerLink]="[child.route]" routerLinkActive="sidebar__sublink--active"
                (click)="menu.close()">
                {{ child.label }}
              </a>
            </li>
          </ul>
        </ng-container>
      </li>
    </ul>
  </nav>
</ng-template>
