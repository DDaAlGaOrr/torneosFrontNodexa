<header class="topbar flex align-items-center justify-content-between">

  <div class="flex align-items-center gap-3">
    <!-- Botón de menú (solo móvil / tablet) -->
    <button class="topbar__hamburger xl:hidden" type="button" aria-label="Abrir menú" [attr.aria-expanded]="menu.open()"
      (click)="menu.toggle()">
      <i class="pi pi-bars"></i>
    </button>

    <div class="topbar__title">
      <h1 class="topbar__heading m-0">{{ pageTitle() }}</h1>
    </div>
  </div>

  <div class="topbar__right flex align-items-center gap-3">
    <div class="topbar__user flex align-items-center gap-2">
      <div class="topbar__user-info hidden md:block">
        <p class="topbar__user-name m-0">{{ user.name }}</p>
        <p class="topbar__user-role m-0">{{ roleLabel }}</p>
      </div>
    </div>

    <button class="topbar__icon-btn topbar__icon-btn--logout" type="button" aria-label="Cerrar sesión"
      pTooltip="Cerrar sesión" tooltipPosition="bottom" (click)="logout()">
      <i class="pi pi-sign-out"></i>
    </button>
  </div>
</header>
