<div class="login-container">
  <div class="login-card fadeInDown">

    <div class="login-card__header">
      <h3 class="login-card__title">Regístrate en los torneos deportivos</h3>
      <p class="login-card__subtitle">Por favor, inicie sesión en su cuenta</p>
    </div>

    <form [formGroup]="authForm" (ngSubmit)="onSubmited()" novalidate>
      <div class="login-field">
        <label for="username">Correo</label>
        <input id="username" pInputText type="email" placeholder="ejemplo@email.com" formControlName="email"
          autocomplete="username" />
      </div>

      <div class="login-field">
        <label for="password">Contraseña</label>
        <p-password inputId="password" formControlName="password" [feedback]="false" [toggleMask]="true"
          placeholder="••••••••" autocomplete="current-password" />
      </div>

      <p-message *ngIf="error" severity="error" [text]="error" styleClass="login-error" />

      <p-button type="submit" styleClass="login-submit" [label]="loading ? 'Ingresando...' : 'Ingresar'"
        [loading]="loading" [disabled]="!authForm.valid || loading" />
    </form>

  </div>
</div>
